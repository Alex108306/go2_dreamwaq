id = "direct-obs-scale"
level = 1
stage = "stage2_env"
source = "dreamwaq_direct/source/dreamwaq_direct/dreamwaq_direct/tasks/locomotion/dreamwaq_env.py"
task = "Scale the observations — bring each group to O(1)"
hints = [
    "The cfg has obs_scale_lin_vel / obs_scale_ang_vel / obs_scale_dof_pos / obs_scale_dof_vel",
    "Four lines are enough. Multiply each variable by its scale",
    "gravity and actions are already O(1), so they aren't scaled (1.0 in the original too)",
    "Why it's needed: raw joint_vel is ±20 rad/s while the commands are ±1. Without scaling, joint velocity dominates the observation and the policy ignores the commands",
]
body = """        lin_vel_b = lin_vel_b * self.cfg.obs_scale_lin_vel
        ang_vel_b = ang_vel_b * self.cfg.obs_scale_ang_vel
        joint_pos_rel = joint_pos_rel * self.cfg.obs_scale_dof_pos
        joint_vel = joint_vel * self.cfg.obs_scale_dof_vel
"""
