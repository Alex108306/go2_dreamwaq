id = "reward-power-distribution"
level = 2
stage = "stage2_env"
source = "dreamwaq_manager/source/dreamwaq_manager/dreamwaq_manager/tasks/locomotion/mdp/rewards.py"
task = "Complete the penalty for imbalanced power distribution across joints: var(torque x angular velocity)^2"
hints = [
    "This time don't take the absolute value — it's the variance of the signed power as-is",
    "Look at the variance over the joint axis (dim=-1), not the sum: torch.var",
    "Square the variance once more (paper Table I: var(tau . theta_dot)^2)",
    "If all joints use the same power, the variance is 0, so the penalty must be 0",
]
body = """    asset = env.scene[asset_cfg.name]
    joint_power = (
        asset.data.applied_torque[:, asset_cfg.joint_ids] * asset.data.joint_vel[:, asset_cfg.joint_ids]
    )
    return torch.square(torch.var(joint_power, dim=-1))
"""
