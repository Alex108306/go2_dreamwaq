id = "reward-foot-clearance"
level = 2
stage = "stage2_env"
source = "dreamwaq_manager/source/dreamwaq_manager/dreamwaq_manager/tasks/locomotion/mdp/rewards.py"
task = "Convert foot height to 'height above terrain', and sum the difference from the target clearance weighted by lateral velocity"
hints = [
    "feet_pos_w[:, :, 2] is world z. On bumpy terrain it can't be used as-is",
    "Approximate terrain height with the mean of height_sensor's ray_hits_w[..., 2] (same idea as task05's height scan)",
    "ray hits can contain NaN/inf. Turn them into 0 with torch.nan_to_num",
    "If height_sensor_cfg is None, use world z as-is without terrain correction (flat-only fallback)",
    "Lateral velocity = sqrt(vx^2 + vy^2). Don't include z velocity",
    "Why weight by velocity: to demand clearance only while the foot is lifted and 'moving', and not penalize a foot planted on the ground",
    "Sum over the 4 feet with dim=1 to get one scalar per env",
]

body = """    asset = env.scene[asset_cfg.name]
    feet_pos_w = asset.data.body_pos_w[:, asset_cfg.body_ids, :]
    feet_vel_w = asset.data.body_lin_vel_w[:, asset_cfg.body_ids, :]

    # Foot height ABOVE TERRAIN (not world Z). On uneven ground the terrain under
    # the feet differs from world Z, so we subtract the mean of the base-mounted
    # height scanner's ray hits as a flat-terrain approximation.
    if height_sensor_cfg is not None:
        height_sensor: RayCaster = env.scene.sensors[height_sensor_cfg.name]
        ray_hits_z = torch.nan_to_num(
            height_sensor.data.ray_hits_w[..., 2], nan=0.0, posinf=0.0, neginf=0.0
        )
        mean_terrain_z = torch.mean(ray_hits_z, dim=1)
        feet_z_above_terrain = feet_pos_w[:, :, 2] - mean_terrain_z[:, None]
    else:
        feet_z_above_terrain = feet_pos_w[:, :, 2]

    feet_lateral_speed = torch.sqrt(feet_vel_w[:, :, 0] ** 2 + feet_vel_w[:, :, 1] ** 2)
    return torch.sum(
        (feet_z_above_terrain - desired_height) ** 2 * feet_lateral_speed,
        dim=1,
    )
"""
