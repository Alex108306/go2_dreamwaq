id = "reward-joint-power"
level = 1
stage = "stage2_env"
source = "dreamwaq_manager/source/dreamwaq_manager/dreamwaq_manager/tasks/locomotion/mdp/rewards.py"
task = "Complete the joint power consumption penalty: sum(|torque| x |angular velocity|)"
hints = [
    "Torque is asset.data.applied_torque, angular velocity is asset.data.joint_vel",
    "Take the absolute value of both — power is treated as 'consumption', so the sign doesn't matter",
    "You must select the target joints with asset_cfg.joint_ids",
    "Sum the 12 joints with dim=1 to get one scalar per env",
]
body = """    asset = env.scene[asset_cfg.name]
    return torch.sum(
        torch.abs(asset.data.applied_torque[:, asset_cfg.joint_ids])
        * torch.abs(asset.data.joint_vel[:, asset_cfg.joint_ids]),
        dim=1,
    )
"""
