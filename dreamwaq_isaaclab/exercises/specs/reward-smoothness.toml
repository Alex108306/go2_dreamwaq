id = "reward-smoothness"
level = 2
stage = "stage2_env"
source = "dreamwaq_manager/source/dreamwaq_manager/dreamwaq_manager/tasks/locomotion/mdp/rewards.py"
task = "Compute the action jerk (second-order difference) and update the t-2 buffer"
hints = [
    "Jerk = a_t - 2*a_{t-1} + a_{t-2}. It is a second-order finite difference",
    "IsaacLab's action_manager only gives t and t-1. You must hold t-2 yourself in self.prev_prev_action",
    "This call's prev_action becomes the next call's t-2. Update it before returning",
    "Plain assignment makes it reference the same tensor. Think about why .clone() is needed",
    "The reward must be one scalar per env — square the jerk of the 12 joints and sum with dim=1",
]

body = """        action = env.action_manager.action
        prev_action = env.action_manager.prev_action
        jerk = action - 2.0 * prev_action + self.prev_prev_action
        # cache prev_action as the t-2 for the next call
        self.prev_prev_action = prev_action.clone()
        return torch.sum(torch.square(jerk), dim=1)
"""
