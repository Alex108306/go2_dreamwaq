id = "direct-dones"
level = 2
stage = "stage2_env"
source = "dreamwaq_direct/source/dreamwaq_direct/dreamwaq_direct/tasks/locomotion/dreamwaq_env.py"
task = "Build the two termination conditions — timeout and base contact"
hints = [
    "time_out is the envs whose episode_length_buf is >= max_episode_length - 1 (step indices count from 0)",
    "net_forces_w_history is (envs, history=3, bodies, 3). Get the tensor with .torch",
    "Pick out only the base body with self._termination_contact_ids",
    "Reduce the axes in order: force-vector norm(dim=-1) → history max max(dim=1)[0] → threshold comparison → bodies any(dim=1)",
    "Use the max over history, not the mean. If it hit even once in the 3 frames, it fell",
    "The threshold is self.cfg.termination_contact_force (1.0 N) — same as the original legged_gym",
]

# The section to cut out verbatim from the original. If the source changes, the generator fails with "not found",
# so it never silently drifts. When that happens, update this body to the current code.
body = """        time_out = self.episode_length_buf >= self.max_episode_length - 1

        # Failure termination: trunk touches the terrain.
        #
        # Identical to the original IsaacGym DreamWaQ (`legged_robot.py:check_termination`):
        #   reset_buf = any(norm(contact_forces[:, termination_contact_indices, :]) > 1.0)
        # with `terminate_after_contacts_on = ["base"]` (go2_config.py). The manager stack uses
        # `mdp.illegal_contact` with the same body/threshold, so both stacks match the original
        # and each other. Both contact sensors use history_length=3, hence the max over history.
        net_contact_forces = self._contact_sensor.data.net_forces_w_history.torch
        base_contact = torch.any(
            torch.max(
                torch.linalg.norm(net_contact_forces[:, :, self._termination_contact_ids], dim=-1), dim=1
            )[0]
            > self.cfg.termination_contact_force,
            dim=1,
        )
"""
